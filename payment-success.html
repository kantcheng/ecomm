<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment status | Voltaro EU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1023'/%3E%3Cpath d='M18 5 9 18h6l-2 9 9-13h-6z' fill='%232ea1f2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
  .status-box { max-width:660px; margin:70px auto 90px; padding:46px 36px; background:#fff; border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); text-align:center; }
  .status-box h1 { color:var(--navy); margin:16px 0 8px; font-size:28px; }
  .status-box p { color:var(--muted); line-height:1.7; font-size:14.5px; }
  .status-icon { font-size:58px; line-height:1; }
  .status-actions { margin-top:26px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>

<div class="announce">🔒 Payment verified by Stripe · Your data stays protected</div>

<header class="site">
  <div class="container nav">
    <a class="logo" href="index.html">
      <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="8" fill="#0b1023"/><path d="M18 5 9 18h6l-2 9 9-13h-6z" fill="#2ea1f2"/></svg>
      Voltaro
    </a>
    <div class="nav-actions"><a href="account.html">My Account</a></div>
  </div>
</header>

<div class="status-box" id="statusBox">
  <div class="status-icon">⏳</div>
  <h1>Confirming your payment…</h1>
  <p>Please wait while we verify the payment with the gateway.</p>
</div>

<footer class="site">
  <div class="container foot-bottom">
    <span>© 2026 Voltaro B.V. · All prices include VAT (OSS).</span>
    <span><a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a> · <a href="support.html">Support</a></span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="js/cloud-config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/payment.js"></script>
<script>
  function render(icon, title, message, actions) {
    document.getElementById("statusBox").innerHTML = `
      <div class="status-icon">${icon}</div>
      <h1>${title}</h1>
      <p>${message}</p>
      <div class="status-actions">${actions}</div>`;
  }

  (async () => {
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session_id") || "";
    const orderNo = params.get("order_no") || "";
    if (!sessionId) {
      render("⚠️", "No payment session", "This page needs a payment session to confirm an order.",
        '<a class="btn btn-primary" href="index.html">Back to Home</a>');
      return;
    }
    if (window.VOLTARO_AUTH) {
      const { session } = await window.VOLTARO_AUTH.getSession();
      if (!session) {
        location.href = "login.html?returnTo=" + encodeURIComponent("payment-success.html" + location.search);
        return;
      }
    }
    try {
      const status = await window.VOLTARO_PAY.status(sessionId, orderNo);
      if (!status.paid) {
        render("⏳", "Payment not completed",
          "Your payment has not been confirmed yet. If you closed the wallet app before authorizing, please contact support with order <b>" + orderNo + "</b>.",
          '<a class="btn btn-primary" href="account.html">View my orders</a>');
        return;
      }
      if (orderNo && window.VOLTARO_DB) {
        await window.VOLTARO_DB.markOrderPaid(orderNo, {
          sessionId,
          paymentIntent: status.paymentIntent,
        });
        saveCart({});
      }
      const methodName = status.method === "wechat_pay" ? "WeChat Pay (微信支付)" : "Alipay (支付宝)";
      render("✅", "Payment successful",
        "Order <b>" + orderNo + "</b> has been paid with " + methodName + ".<br>We are preparing your parcel in the Netherlands and will email tracking details shortly.",
        '<a class="btn btn-primary" href="account.html">Track my order</a><a class="btn btn-outline" href="index.html">Back to Home</a>');
    } catch (err) {
      render("⚠️", "Could not confirm payment",
        (err && err.message ? err.message : "Please try again in a moment.") +
        "<br>If you have already been charged, contact support with order <b>" + orderNo + "</b>.",
        '<a class="btn btn-primary" href="account.html">View my orders</a>');
    }
  })();
</script>
</body>
</html>
